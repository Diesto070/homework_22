{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}

<div class="album py-3 bg-body-tertiary">
        <div class="container-fluid">
            <div class="row justify-content-center g-3">
                <div class="col-8">
                    <div class="card shadow-sm h-100">
                        <img src="{{ blog.picture | media_filter }}">
                        <div class="card-body">
                            <p class="card-text">{{ object.heading }}</p>
                            <p class="card-text">{{ object.content }}</p>
                            <p class="card-text">Дата создания: {{ object.created_at }}</p>
                            <p class="card-text">Количество просмотров: {{ object.views_count }}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="btn-group">
                                    <a class="btn btn-primary" href="{% url 'blog:blog_list' %}" role="button">Назад</a>
                                    <a class="btn btn-primary" href="{% url 'blog:blog_update' blog.pk %}" role="button">Редактировать</a>
                               </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
